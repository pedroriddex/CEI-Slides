<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Minimalista - Estable</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #09090b; /* Tailwind zinc-950 */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor principal */
        .canvas-container {
            position: relative;
            width: 800px;
            height: 400px;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            /* Importante: para que los tooltips no interfieran */
            pointer-events: none; 
        }

        /* Líneas de conexión */
        .branch-path {
            fill: none;
            stroke: #52525b; /* zinc-600: sutil */
            stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 2.5s ease-out forwards;
        }

        /* Nodos (Commits) */
        .node {
            fill: #09090b; 
            stroke: #ffffff;
            stroke-width: 2px;
            cursor: pointer;
            /* Reactivamos los eventos de ratón solo para los nodos */
            pointer-events: all;
            transition: all 0.2s ease; /* Transición más rápida para el hover */
            opacity: 0; 
            animation: fadeInOnly 0.8s ease-out forwards;
        }

        /* --- CORRECCIÓN DEL HOVER --- */
        .node:hover {
            fill: #ffffff; /* Se vuelve blanco sólido */
            /* transform: scale(1.5); <--- ELIMINADO EL CAUSANTE DEL ERROR */
            stroke-width: 4px; /* El borde se hace más grueso */
            /* Un brillo blanco intenso y estable */
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9)); 
        }

        /* Zona de Texto (Info flotante) */
        #info-display {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none; 
            height: 60px;
        }

        #info-title {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        #info-desc {
            font-size: 0.9rem;
            color: #a1a1aa; /* zinc-400 */
            font-weight: 300;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease 0.1s; 
        }

        /* Clase activa para mostrar texto */
        .show-text #info-title,
        .show-text #info-desc {
            opacity: 1;
            transform: translateY(0);
        }

        /* Animaciones Keyframes */
        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        @keyframes fadeInOnly {
            from { opacity: 0; }
            to { opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="canvas-container">
        <svg viewBox="0 0 800 400" id="main-svg">
        </svg>

        <div id="info-display">
            <div id="info-title"></div>
            <div id="info-desc"></div>
        </div>
    </div>

    <script>
        const data = [
            { id: 1, x: 100, y: 200, type: 'start', title: 'Creamos el repositorio', desc: 'Aquí todo comienza, esta es la rama principal (Main).' },
            { id: 2, x: 250, y: 200, type: 'commit', title: 'Actualizamos nuestro proyecto', desc: 'Trabajamos en nuestro proyecto y subimos actualizaciones.' },
            { id: 3, x: 350, y: 100, type: 'branch', title: 'Generamos una rama', desc: 'El proyecto sufrirá un gran cambio, para no romper nada generamos una nueva rama' },
            { id: 4, x: 500, y: 100, type: 'commit', title: 'Actualizamos la rama', desc: 'Trabajamos en nuestra nueva rama y subimos actualizaciones.' },
            { id: 5, x: 650, y: 200, type: 'merge', title: 'La unión de las ramas', desc: 'Todo funciona como queremos y ya es hora de unificar la rama con Main.' }
        ];

        const svg = document.getElementById('main-svg');
        const infoDisplay = document.getElementById('info-display');
        const titleEl = document.getElementById('info-title');
        const descEl = document.getElementById('info-desc');

        function drawCurve(x1, y1, x2, y2) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            if (y1 === y2) {
                path.setAttribute("d", `M ${x1} ${y1} L ${x2} ${y2}`);
            } else {
                const midX = (x1 + x2) / 2;
                path.setAttribute("d", `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
            }
            path.classList.add("branch-path");
            svg.appendChild(path);
        }

        drawCurve(data[0].x, data[0].y, data[1].x, data[1].y);
        drawCurve(data[1].x, data[1].y, data[2].x, data[2].y);
        drawCurve(data[1].x, data[1].y, data[4].x, data[4].y);
        drawCurve(data[2].x, data[2].y, data[3].x, data[3].y);
        drawCurve(data[3].x, data[3].y, data[4].x, data[4].y);

        data.forEach((item, index) => {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", item.x);
            circle.setAttribute("cy", item.y);
            circle.setAttribute("r", 12);
            circle.classList.add("node");
            circle.style.animationDelay = `${(index + 1) * 0.5}s`;

            // Usamos mouseover/mouseout que a veces son más estables en SVG
            circle.addEventListener('mouseover', () => {
                titleEl.textContent = item.title;
                descEl.textContent = item.desc;
                infoDisplay.classList.add('show-text');
            });

            circle.addEventListener('mouseout', () => {
                infoDisplay.classList.remove('show-text');
            });

            svg.appendChild(circle);
        });
    </script>
</body>
</html>
