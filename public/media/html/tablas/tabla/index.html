<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{overflow:hidden;background:#E5E5EA;color:#1D1D1F;display:flex;align-items:center;justify-content:center;padding:clamp(14px,4vw,40px);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:400}
.demo{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.6vh,22px);width:100%;max-width:560px;opacity:0;transform:translateY(10px);animation:fadeIn .55s ease-out .15s forwards}
@keyframes fadeIn{to{opacity:1;transform:none}}
.cap{font-size:.85rem;color:#1D1D1F;text-align:center;line-height:1.45}
.cap b{color:#FF2D55;font-weight:600}
.mono{font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}
table{border-collapse:collapse;background:#fff;border-radius:.4em;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.08)}
th,td{padding:.65em 1.4em;text-align:left;font-size:.95rem;border-bottom:1px solid #ececf0}
thead th{background:#FF2D55;color:#fff;font-weight:600}
tbody tr:last-child td{border-bottom:none}
</style></head>
<body>
<div class="demo">
<table>
<thead><tr><th>Nombre</th><th>Edad</th></tr></thead>
<tbody><tr><td>Ana</td><td>28</td></tr><tr><td>Luis</td><td>34</td></tr><tr><td>Marta</td><td>41</td></tr></tbody>
</table>
<p class="cap">Filas (<b>&lt;tr&gt;</b>) y celdas (<b>&lt;td&gt;</b> / <b>&lt;th&gt;</b>)</p>
</div>
</body></html>
