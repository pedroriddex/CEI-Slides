<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{overflow:hidden;background:#E5E5EA;color:#1D1D1F;display:flex;align-items:center;justify-content:center;padding:clamp(14px,4vw,40px);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-weight:300}
.demo{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.6vh,22px);width:100%;max-width:560px;opacity:0;transform:translateY(10px);animation:fadeIn .55s ease-out .15s forwards}
@keyframes fadeIn{to{opacity:1;transform:none}}
.cap{font-size:.85rem;color:#1D1D1F;text-align:center;line-height:1.45}
.cap b{color:#FF2D55;font-weight:600}
.mono{font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}
.wire{width:100%;max-width:470px;display:flex;flex-direction:column;gap:8px}
.box{border:1.5px solid #c7c7cc;border-radius:.45em;background:#fff;padding:.65em .8em}
.tag{color:#FF2D55;font-size:.72rem;font-weight:600;font-family:monospace}
.row{display:flex;gap:8px}.row .main{flex:2}.row .aside{flex:1}
.box--main,.box--aside{min-height:84px}
.nav{display:flex;gap:12px;font-size:.74rem;margin-top:.4em}.nav b{color:#FF2D55}
.ln{height:8px;border-radius:99px;background:#ececf0;margin-top:.55em}.ln.s{width:60%}
</style></head>
<body>
<div class="demo">
<div class="wire">
<div class="box"><span class="tag">&lt;header&gt;</span><div class="nav"><b>Inicio</b><span>Blog</span><span>Contacto</span></div></div>
<div class="row">
<div class="box box--main main"><span class="tag">&lt;main&gt;</span><div class="ln"></div><div class="ln s"></div></div>
<div class="box box--aside aside"><span class="tag">&lt;aside&gt;</span><div class="ln"></div></div>
</div>
<div class="box"><span class="tag">&lt;footer&gt;</span></div>
</div>
<p class="cap">Cada región tiene su etiqueta con <b>significado</b></p>
</div>
</body></html>
