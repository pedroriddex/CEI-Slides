<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{overflow:hidden;background:#E5E5EA;color:#1D1D1F;display:flex;align-items:center;justify-content:center;padding:clamp(14px,4vw,40px);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-weight:300}
.demo{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.6vh,22px);width:100%;max-width:560px;opacity:0;transform:translateY(10px);animation:fadeIn .55s ease-out .15s forwards}
@keyframes fadeIn{to{opacity:1;transform:none}}
.cap{font-size:.85rem;color:#1D1D1F;text-align:center;line-height:1.45}
.cap b{color:#FF2D55;font-weight:600}
.mono{font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}
.heads{display:flex;align-items:stretch;gap:14px}
.heads__bar{width:4px;border-radius:99px;background:#FF2D55;flex:0 0 4px}
.heads__list{display:flex;flex-direction:column;gap:.28em;align-items:flex-start}
.heads__list>*{margin:0;line-height:1.05;font-weight:600;white-space:nowrap}
.heads__list h1{font-size:clamp(1.5rem,5.5vw,2.4rem)} .heads__list h2{font-size:clamp(1.25rem,4.3vw,1.9rem)} .heads__list h3{font-size:clamp(1.05rem,3.5vw,1.5rem)} .heads__list h4{font-size:1.15rem} .heads__list h5{font-size:.95rem} .heads__list h6{font-size:.82rem;font-weight:300}
</style></head>
<body>
<div class="demo">
<div class="heads"><div class="heads__bar"></div><div class="heads__list">
<h1>Título h1</h1><h2>Subtítulo h2</h2><h3>Apartado h3</h3><h4>Sección h4</h4><h5>Detalle h5</h5><h6>Nota h6</h6>
</div></div>
<p class="cap">De <b>h1</b> a <b>h6</b>: de mayor a menor jerarquía</p>
</div>
</body></html>
