<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{overflow:hidden;background:#E5E5EA;color:#1D1D1F;display:flex;align-items:center;justify-content:center;padding:clamp(14px,4vw,40px);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:400}
.demo{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.6vh,22px);width:100%;max-width:560px;opacity:0;transform:translateY(10px);animation:fadeIn .55s ease-out .15s forwards}
@keyframes fadeIn{to{opacity:1;transform:none}}
.cap{font-size:.85rem;color:#1D1D1F;text-align:center;line-height:1.45}
.cap b{color:#FF2D55;font-weight:600}
.mono{font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}
.lists{display:flex;gap:clamp(14px,4vw,30px);flex-wrap:wrap;justify-content:center;align-items:flex-start}
.lists>div{background:#fff;border-radius:.4em;padding:.9em 1.2em;box-shadow:0 10px 40px rgba(0,0,0,.06);min-width:115px}
.lists h4{margin:0 0 .5em;font-size:.72rem;color:#FF2D55;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.lists ul,.lists ol{margin:0;padding-left:1.2em;line-height:1.7;font-size:.9rem}
.lists dl{margin:0;font-size:.9rem;line-height:1.45}
.lists dt{font-weight:600}.lists dd{margin:0 0 .4em;color:#666}
</style></head>
<body>
<div class="demo">
<div class="lists">
<div><h4>ul</h4><ul><li>Manzana</li><li>Pera</li><li>Uva</li></ul></div>
<div><h4>ol</h4><ol><li>Primero</li><li>Segundo</li><li>Tercero</li></ol></div>
<div><h4>dl</h4><dl><dt>HTML</dt><dd>Estructura</dd><dt>CSS</dt><dd>Estilo</dd></dl></div>
</div>
<p class="cap">No ordenadas, ordenadas y de definiciones</p>
</div>
</body></html>
