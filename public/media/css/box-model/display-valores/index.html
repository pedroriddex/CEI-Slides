<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{overflow:hidden;background:oklch(0.9524 0.0013 286.37);color:oklch(0.2103 0.0059 285.89);display:flex;align-items:center;justify-content:center;padding:clamp(16px,5vw,44px);font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:520px;display:flex;justify-content:center}
.card{background:#fff;border:1px solid oklch(90% 0.004 286.32);border-radius:16px;box-shadow:0 2px 4px 0 rgba(0,0,0,.04), 0 1px 2px 0 rgba(0,0,0,.06), 0 0 1px 0 rgba(0,0,0,.06)}
.val{font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:oklch(0.5517 0.0138 285.94);letter-spacing:.01em;white-space:nowrap}
.in{opacity:0;transform:translateY(6px);animation:in .45s cubic-bezier(.22,1,.36,1) forwards}
.in:nth-child(1){animation-delay:.05s}.in:nth-child(2){animation-delay:.12s}.in:nth-child(3){animation-delay:.19s}.in:nth-child(4){animation-delay:.26s}
@keyframes in{to{opacity:1;transform:none}}
.rows{width:100%;display:flex;flex-direction:column;gap:16px;padding:22px 24px}
.row{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:12px}
.area{min-height:30px;line-height:30px}
.el{background:color-mix(in oklab, oklch(0.6204 0.195 253.83) 35%, white);border-radius:6px;font-size:12px;color:oklch(0.2103 0.0059 285.89)}
.blk{display:block;height:14px;margin-bottom:6px}.blk:last-child{margin-bottom:0}
.inl{display:inline;padding:3px 8px;margin-right:6px}
.ibk{display:inline-block;width:64px;height:28px;margin-right:8px;vertical-align:middle}
</style></head>
<body>
<div class="wrap">
<div class="card rows in">
<div class="row"><span class="val">block</span><div class="area"><span class="el blk"></span><span class="el blk"></span></div></div>
<div class="row"><span class="val">inline</span><div class="area"><span class="el inl">Hola</span><span class="el inl">mundo</span></div></div>
<div class="row"><span class="val">inline-block</span><div class="area"><span class="el ibk"></span><span class="el ibk"></span></div></div>
<div class="row"><span class="val">none</span><div class="area"><span class="el inl">A</span><span class="el inl" style="display: none;">B</span><span class="el inl">C</span></div></div>
</div>
</div>
</body></html>
