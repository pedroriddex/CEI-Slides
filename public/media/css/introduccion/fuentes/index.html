<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{overflow:hidden;background:oklch(0.9524 0.0013 286.37);color:oklch(0.2103 0.0059 285.89);display:flex;align-items:center;justify-content:center;padding:clamp(16px,5vw,44px);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:520px;display:flex;justify-content:center}
.card{background:#fff;border:1px solid oklch(90% 0.004 286.32);border-radius:16px;box-shadow:0 2px 4px 0 rgba(0,0,0,.04), 0 1px 2px 0 rgba(0,0,0,.06), 0 0 1px 0 rgba(0,0,0,.06)}
.val{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;font-weight:500;color:oklch(0.5517 0.0138 285.94);white-space:nowrap}
.in{opacity:0;transform:translateY(6px);animation:in .45s cubic-bezier(.22,1,.36,1) forwards}
.in:nth-child(1){animation-delay:.05s}.in:nth-child(2){animation-delay:.12s}.in:nth-child(3){animation-delay:.19s}.in:nth-child(4){animation-delay:.26s}.in:nth-child(5){animation-delay:.33s}
@keyframes in{to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px 8px}
.tile b{font-size:clamp(30px,6vw,40px);font-weight:400;line-height:1}
</style></head>
<body>
<div class="wrap">
<div class="grid">
<div class="card tile in"><b style="font-family: Arial, sans-serif;">Aa</b><span class="val">Arial</span></div>
<div class="card tile in"><b style="font-family: Georgia, serif;">Aa</b><span class="val">Georgia</span></div>
<div class="card tile in"><b style="font-family: 'Courier New', monospace;">Aa</b><span class="val">Courier New</span></div>
<div class="card tile in"><b style="font-family: 'Snell Roundhand', 'Brush Script MT', cursive;">Aa</b><span class="val">Script</span></div>
</div>
</div>
</body></html>
