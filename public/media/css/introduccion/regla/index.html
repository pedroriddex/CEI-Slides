<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{overflow:hidden;background:oklch(0.9524 0.0013 286.37);color:oklch(0.2103 0.0059 285.89);display:flex;align-items:center;justify-content:center;padding:clamp(16px,5vw,44px);font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:520px;display:flex;justify-content:center}
.card{background:#fff;border:1px solid oklch(90% 0.004 286.32);border-radius:16px;box-shadow:0 2px 4px 0 rgba(0,0,0,.04), 0 1px 2px 0 rgba(0,0,0,.06), 0 0 1px 0 rgba(0,0,0,.06)}
.val{font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:oklch(0.5517 0.0138 285.94);letter-spacing:.01em;white-space:nowrap}
.in{opacity:0;transform:translateY(6px);animation:in .45s cubic-bezier(.22,1,.36,1) forwards}
.in:nth-child(1){animation-delay:.05s}.in:nth-child(2){animation-delay:.12s}.in:nth-child(3){animation-delay:.19s}.in:nth-child(4){animation-delay:.26s}.in:nth-child(5){animation-delay:.33s}
@keyframes in{to{opacity:1;transform:none}}
.rule{display:flex;align-items:flex-start;gap:clamp(8px,2vw,14px);padding:26px 30px}
.tok{display:flex;flex-direction:column;align-items:center;gap:10px}
.tok code{font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;font-size:clamp(22px,4.4vw,30px);font-weight:500;line-height:1;padding-bottom:8px;border-bottom:2px solid transparent}
.tok.k code{border-bottom-color:oklch(0.6204 0.195 253.83)}
.tok.p code{color:oklch(0.5517 0.0138 285.94)}
</style></head>
<body>
<div class="wrap">
<div class="card rule">
<div class="tok k in"><code>p</code><span class="val">selector</span></div>
<div class="tok p"><code>{</code></div>
<div class="tok k in"><code>color</code><span class="val">propiedad</span></div>
<div class="tok p"><code>:</code></div>
<div class="tok k in"><code style="color:oklch(0.6204 0.195 253.83)">blue</code><span class="val">valor</span></div>
<div class="tok p"><code>;</code></div>
<div class="tok p"><code>}</code></div>
</div>
</div>
</body></html>
