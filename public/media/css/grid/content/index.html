<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>justify-content / align-content</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{overflow:hidden;background:oklch(0.9524 0.0013 286.37);color:oklch(0.2103 0.0059 285.89);display:flex;align-items:center;justify-content:center;padding:10px clamp(12px,4vw,32px);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
:root{--acc:oklch(0.6204 0.195 253.83);--fg:oklch(0.2103 0.0059 285.89);--muted:oklch(0.5517 0.0138 285.94);--line:oklch(90% 0.004 286.32);--mono:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--code:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}
.card{width:100%;max-width:540px;max-height:100%;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 4px 0 rgba(0,0,0,.04),0 1px 2px 0 rgba(0,0,0,.06),0 0 1px 0 rgba(0,0,0,.06);padding:20px;display:flex;flex-direction:column;gap:16px;opacity:0;transform:translateY(6px);animation:in .45s cubic-bezier(.22,1,.36,1) .05s forwards}
@keyframes in{to{opacity:1;transform:none}}
.controls{display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.ctl{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.prop{font-size:12.5px;font-weight:500;color:var(--muted);margin-right:6px}
.chip{font-family:var(--mono);font-size:12.5px;font-weight:500;line-height:1;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--fg);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:oklch(80% 0.006 286)}
.chip.on{background:var(--fg);border-color:var(--fg);color:#fff}
.stage{position:relative;border-radius:12px;background:oklch(0.97 0.0015 286);outline:1px dashed oklch(82% 0.008 286);outline-offset:-1px;padding:10px;overflow:hidden}
.it{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--fg);min-width:36px;min-height:32px}
.it span{display:block;white-space:nowrap}
.it.hl{background:var(--acc)!important;color:#fff}
.cells{position:absolute;inset:10px;display:grid;pointer-events:none}
.cells i{border:1px dashed oklch(78% 0.01 286);border-radius:9px}
#stage{display:grid;gap:8px;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,44px);height:220px}
#stage>.it{}

</style></head>
<body>
<div class="card">
<div class="controls"><div class="ctl" data-prop="justify-content" data-target="stage"><span class="prop">justify-content:</span><button class="chip on" data-v="start">start</button><button class="chip" data-v="center">center</button><button class="chip" data-v="end">end</button><button class="chip" data-v="space-between">space-between</button><button class="chip" data-v="space-around">space-around</button><button class="chip" data-v="space-evenly">space-evenly</button></div><div class="ctl" data-prop="align-content" data-target="stage"><span class="prop">align-content:</span><button class="chip on" data-v="start">start</button><button class="chip" data-v="center">center</button><button class="chip" data-v="end">end</button><button class="chip" data-v="space-between">space-between</button><button class="chip" data-v="space-around">space-around</button><button class="chip" data-v="space-evenly">space-evenly</button></div></div>
<div class="stage" id="stage"><div class="it" style="background:color-mix(in oklab, var(--acc) 16%, white);"><span>1</span></div><div class="it" style="background:color-mix(in oklab, var(--acc) 24%, white);"><span>2</span></div><div class="it" style="background:color-mix(in oklab, var(--acc) 32%, white);"><span>3</span></div><div class="it" style="background:color-mix(in oklab, var(--acc) 40%, white);"><span>4</span></div><div class="it" style="background:color-mix(in oklab, var(--acc) 48%, white);"><span>5</span></div><div class="it" style="background:color-mix(in oklab, var(--acc) 56%, white);"><span>6</span></div></div>
</div>
<script>
const stage=document.getElementById('stage');
const items=[...stage.querySelectorAll(':scope > .it')];
const hl=stage.querySelector('.hl');
const groups=[...document.querySelectorAll('.ctl')];
function apply(g,chip,animate){
  const before=animate?items.map(el=>el.getBoundingClientRect()):null;
  const t=g.dataset.target;
  if(t==='body')document.body.dataset[g.dataset.prop]=chip.dataset.v;
  else (t==='hl'?hl:stage).style.setProperty(g.dataset.prop,chip.dataset.v);
  g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===chip));
  if(!animate)return;
  items.forEach((el,i)=>{
    const a=before[i],b=el.getBoundingClientRect();
    if(!b.width||!a.width)return;
    const dx=a.left-b.left,dy=a.top-b.top,sx=a.width/b.width,sy=a.height/b.height;
    if(Math.abs(dx)<.5&&Math.abs(dy)<.5&&Math.abs(sx-1)<.01&&Math.abs(sy-1)<.01)return;
    const o={duration:520,easing:'cubic-bezier(.22,1,.36,1)'};
    el.animate([{transformOrigin:'0 0',transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')'},{transformOrigin:'0 0',transform:'none'}],o);
    const s=el.firstElementChild;if(s)s.animate([{transform:'scale('+(1/sx)+','+(1/sy)+')'},{transform:'none'}],o);
  });
}
groups.forEach(g=>{
  const chips=[...g.querySelectorAll('.chip')];
  apply(g,chips.find(c=>c.classList.contains('on'))||chips[0],false);
  chips.forEach(c=>c.addEventListener('click',()=>{stop();apply(g,c,true);}));
});
let timer=null;const first=groups[0];
function stop(){clearInterval(timer);timer=null;}
if(first){timer=setInterval(()=>{const cs=[...first.querySelectorAll('.chip')];const i=cs.findIndex(c=>c.classList.contains('on'));apply(first,cs[(i+1)%cs.length],true);},2600);}
</script>
</body></html>
